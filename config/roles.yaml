# Mattermost usernames -> Lantern roles. Resolved to user_ids at startup;
# the record service only ever matches on user_id. All people are fictional.
users:
  patient-101:      {role: patient, patient_id: "101", display: "Patient 101"}
  patient-102:      {role: patient, patient_id: "102", display: "Patient 102"}
  patient-103:      {role: patient, patient_id: "103", display: "Patient 103", language: es}
  patient-104:      {role: patient, patient_id: "104", display: "Patient 104"}
  nurse-ana:        {role: nurse, shift: outgoing, display: "Nurse Ana"}
  nurse-ben:        {role: nurse, shift: incoming, display: "Nurse Ben"}
  dr-lee:           {role: doctor, display: "Dr. Lee"}
  service-sam:      {role: service, display: "Sam (room service)"}
  service-rita:     {role: service, display: "Rita (room service)"}
  intake:           {role: agent, display: "intake"}
  care-coordinator: {role: agent, display: "care-coordinator"}
  interpreter:      {role: agent, display: "interpreter"}
  scribe:           {role: agent, display: "scribe"}
  record-bot:       {role: bot, display: "record-bot"}

# Switch room membership (the first boundary). No agent is ever in a patient room.
rooms:
  patient-101:   [patient-101, record-bot]
  patient-102:   [patient-102, record-bot]
  patient-103:   [patient-103, record-bot]
  patient-104:   [patient-104, record-bot]
  nurse-station: [nurse-ana, nurse-ben, intake, care-coordinator, interpreter, scribe, record-bot]
  doctor-review: [dr-lee, nurse-ana, care-coordinator, interpreter, scribe, record-bot]

  # Ward feeds: staff-only rooms that record-bot writes to when something downstream needs to know. No agents, no patients.
  orders:        [dr-lee, nurse-ana, nurse-ben, record-bot]       # every simulated chart change
  medication:    [nurse-ana, nurse-ben, dr-lee, record-bot]       # every GIVEN, kept apart from orders
  room-service:  [service-sam, service-rita, nurse-ana, nurse-ben, record-bot]   # diet changes that affect a tray; room service closes tasks here with DONE <id>

first_case_number: 17
